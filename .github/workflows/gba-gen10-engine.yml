name: Build CRYSTAL Gen10 engine patch

on:
  push:
    paths:
      - "tools/apply_crystal_gen10_patch.py"
      - "config/gba_gen10_capacity.json"
      - "engine/gba/**"
      - ".github/workflows/gba-gen10-engine.yml"
  pull_request:
    paths:
      - "tools/apply_crystal_gen10_patch.py"
      - "config/gba_gen10_capacity.json"
      - "engine/gba/**"
      - ".github/workflows/gba-gen10-engine.yml"

env:
  GAME_VERSION: EMERALD
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRYSTAL
        uses: actions/checkout@v4

      - name: Checkout pinned pokeemerald-expansion
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
          path: _upstream/pokeemerald-expansion
          fetch-depth: 1

      - name: Apply CRYSTAL Gen10 patch
        run: |
          python3 tools/apply_crystal_gen10_patch.py _upstream/pokeemerald-expansion
          git -C _upstream/pokeemerald-expansion diff --stat
          git -C _upstream/pokeemerald-expansion diff --check

      - name: Install GBA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi             libpng-dev python3

      - name: Build patched Emerald engine
        working-directory: _upstream/pokeemerald-expansion
        run: make -j$(nproc) -O all
