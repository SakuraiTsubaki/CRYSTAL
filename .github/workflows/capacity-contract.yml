name: Validate native Generation 10 capacity

on:
  push:
    paths:
      - "config/engine_capacity.json"
      - "config/storage_profiles.json"
      - "config/native_gbc_stage0.json"
      - "config/native_gbc_stage1.json"
      - "engine/include/**"
      - "research/evidence/**"
      - "docs/GEN10_EXPANSION_ARCHITECTURE.md"
      - "docs/EVIDENCE_DRIVEN_EXPANSION.md"
      - "docs/SAVE_FORMAT_V2.md"
      - "docs/NATIVE_GBC_STAGE1.md"
      - "tools/analyze_crystal_inputs.py"
      - "tools/expand_original_crystal.py"
      - "tools/seed_native_registries.py"
      - "tools/validate_capacity.py"
      - "tools/validate_native_stage0.py"
      - "tools/validate_native_stage1.py"
      - ".github/workflows/capacity-contract.yml"
  pull_request:
    paths:
      - "config/engine_capacity.json"
      - "config/storage_profiles.json"
      - "config/native_gbc_stage0.json"
      - "config/native_gbc_stage1.json"
      - "engine/include/**"
      - "research/evidence/**"
      - "docs/GEN10_EXPANSION_ARCHITECTURE.md"
      - "docs/EVIDENCE_DRIVEN_EXPANSION.md"
      - "docs/SAVE_FORMAT_V2.md"
      - "docs/NATIVE_GBC_STAGE1.md"
      - "tools/analyze_crystal_inputs.py"
      - "tools/expand_original_crystal.py"
      - "tools/seed_native_registries.py"
      - "tools/validate_capacity.py"
      - "tools/validate_native_stage0.py"
      - "tools/validate_native_stage1.py"
      - ".github/workflows/capacity-contract.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate evidence-driven capacity contract
        run: python3 tools/validate_capacity.py

      - name: Validate native GBC Stage 0
        run: python3 tools/validate_native_stage0.py

      - name: Validate native GBC Stage 1
        run: python3 tools/validate_native_stage1.py

      - name: Compile-check native transform tools
        run: |
          python3 -m py_compile             tools/expand_original_crystal.py             tools/seed_native_registries.py             tools/validate_capacity.py             tools/validate_native_stage0.py             tools/validate_native_stage1.py
