name: Build native Crystal ID Stage 2c legacy box insertion

on:
  push:
    paths:
      - "config/native_id_stage2c_box_insert.json"
      - "tools/apply_native_id_stage2c_box_insert.py"
      - "tools/verify_native_id_stage2c_box_insert.py"
      - "tools/apply_native_id_stage2b_move.py"
      - ".github/workflows/native-id-stage2c-box-insert.yml"
  pull_request:
    paths:
      - "config/native_id_stage2c_box_insert.json"
      - "tools/apply_native_id_stage2c_box_insert.py"
      - "tools/verify_native_id_stage2c_box_insert.py"
      - "tools/apply_native_id_stage2b_move.py"
      - ".github/workflows/native-id-stage2c-box-insert.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout CRYSTAL
      - uses: actions/checkout@v4
        name: Checkout pinned Crystal source
        with:
          repository: pret/pokecrystal
          ref: e058e4f50b3bbf7377e036b81c25a72c54656c5c
          path: _source/pokecrystal
          fetch-depth: 1
      - uses: actions/checkout@v4
        name: Checkout RGBDS 1.0.4
        with:
          repository: gbdev/rgbds
          ref: v1.0.4
          path: _source/rgbds
          fetch-depth: 1
      - name: Install RGBDS
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          sudo make -C _source/rgbds -j$(nproc) install
      - name: Apply native ID stack through Stage 2c
        run: |
          python3 tools/apply_native_source_stage0.py _source/pokecrystal
          python3 tools/apply_native_id_stage1.py _source/pokecrystal
          python3 tools/apply_native_id_stage2_box.py _source/pokecrystal
          python3 tools/apply_native_id_stage2b_move.py _source/pokecrystal
          python3 tools/apply_native_id_stage2c_box_insert.py _source/pokecrystal
          git -C _source/pokecrystal diff --check
      - name: Build Rev0 and RevA
        working-directory: _source/pokecrystal
        run: make -j$(nproc) crystal crystal11
      - name: Verify Rev0
        run: |
          python3 tools/verify_native_id_stage2b_move.py _source/pokecrystal/pokecrystal.gbc _source/pokecrystal/pokecrystal.sym
          python3 tools/verify_native_id_stage2c_box_insert.py _source/pokecrystal/pokecrystal.gbc _source/pokecrystal/pokecrystal.sym
      - name: Verify RevA
        run: |
          python3 tools/verify_native_id_stage2b_move.py _source/pokecrystal/pokecrystal11.gbc _source/pokecrystal/pokecrystal11.sym
          python3 tools/verify_native_id_stage2c_box_insert.py _source/pokecrystal/pokecrystal11.gbc _source/pokecrystal/pokecrystal11.sym
