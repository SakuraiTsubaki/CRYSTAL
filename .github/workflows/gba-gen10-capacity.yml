name: Validate CRYSTAL GBA Gen10 capacity

on:
  push:
    paths:
      - "config/gba_gen10_capacity.json"
      - "engine/gba/**"
      - "tools/audit_gba_capacity.py"
      - ".github/workflows/gba-gen10-capacity.yml"
      - "patches/pokeemerald-expansion/**"
  pull_request:
    paths:
      - "config/gba_gen10_capacity.json"
      - "engine/gba/**"
      - "tools/audit_gba_capacity.py"
      - ".github/workflows/gba-gen10-capacity.yml"
      - "patches/pokeemerald-expansion/**"

jobs:
  capacity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRYSTAL
        uses: actions/checkout@v4

      - name: Checkout pinned pokeemerald-expansion
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
          path: _upstream/pokeemerald-expansion
          fetch-depth: 1

      - name: Compile 16-bit ID packing test
        run: |
          cc -std=c11 -Wall -Wextra -Werror             engine/gba/tests/test_crystal_gen10_ids.c             -Iengine/gba/include             -o /tmp/test_crystal_gen10_ids
          /tmp/test_crystal_gen10_ids

      - name: Audit pinned GBA storage limits
        run: python3 tools/audit_gba_capacity.py _upstream/pokeemerald-expansion
